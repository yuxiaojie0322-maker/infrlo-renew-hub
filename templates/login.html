<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制台登录 | Infrlo Renew Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0718;
      background-image: 
        radial-gradient(at 20% 20%, rgba(139, 92, 246, 0.18) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
    }
    .glass-card {
      background: rgba(22, 17, 43, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">

  <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/30">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2 class="text-xl font-bold tracking-tight text-white">安全身份验证</h2>
      <p class="text-xs text-slate-400">请输入访问密码进入 Renew Hub 管理控制台</p>
    </div>

    {% if error %}
    <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">访问密码 (Admin Password)</label>
        <div class="relative">
          <input 
            type="password" 
            name="password" 
            required 
            autofocus 
            placeholder="请输入密码..."
            class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
          />
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-brand-500/25 transition active:scale-[0.98]"
      >
        进入控制台
      </button>
    </form>

    <div class="text-center pt-2">
      <p class="text-[11px] text-slate-500">
        默认密码为 <code class="px-1.5 py-0.5 rounded bg-white/10 text-brand-300">admin888</code>，可在环境变量中修改
      </p>
    </div>
  </div>

</body>
</html>
